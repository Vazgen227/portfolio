<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans&display=swap"
      rel="stylesheet"
    />
    <link
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    rel="stylesheet"
  />
    <title>ToDo</title>
  </head>
  <body>
     <div class="todo-app" id="todoApp">

  <h1 class="todo-title">Todo List</h1>

  <!-- Добавление задачи -->
  <div class="todo-input">
    <input 
      type="text" 
      id="todoInput" 
      placeholder="Введите задачу..."
    />
    <button id="addTaskBtn">Добавить</button>
  </div>

  <!-- Фильтры -->
  <div class="todo-filters">
    <button data-filter="all" class="filter-btn active">Все</button>
    <button data-filter="active" class="filter-btn">Активные</button>
    <button data-filter="completed" class="filter-btn">Выполненные</button>
  </div>

  <!-- Список задач -->
  <ul class="todo-list" id="todoList"></ul>

  <!-- Нижняя панель -->
  <div class="todo-footer">
    <span id="taskCounter">0 задач</span>
    <button id="clearCompletedBtn">Удалить выполненные</button>
  </div>

</div>

  </body>
  <script src="app.js"></script>
</html>
